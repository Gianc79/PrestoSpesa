<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrestoSpesa</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        html, body { width: 100%; height: 100dvh; height: 100vh; background: #000; color: #fff; overflow: hidden; display: flex; flex-direction: column; }
        
        header { background: #1f1f1f; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10; flex-shrink: 0; }
        .last-price { font-size: 0.85rem; color: #aaa; display: flex; flex-direction: column; }
        .last-price span { font-size: 1.1rem; font-weight: bold; color: #4cd964; }
        .total { font-size: 1.6rem; font-weight: bold; color: #fff; text-align: center; flex: 1; }
        .list-btn { background: #333; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 5px; z-index: 20; }
        .list-btn span { background: #4cd964; color: #000; border-radius: 50%; padding: 2px 5px; font-size: 0.75rem; font-weight: bold; pointer-events: none; }

        .container { flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #111; }
        
        #video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; pointer-events: none; }
        
        .center-group { position: absolute; top: 38%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 15; width: 100%; }

        .scanner-row { display: flex; align-items: center; gap: 10px; }
        .viewfinder { width: 150px; height: 55px; border: 3px solid #ffcc00; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); pointer-events: none; }
        
        .zoom-controls { display: flex; flex-direction: column; gap: 4px; }
        .zoom-btn { width: 30px; height: 30px; background: rgba(0,0,0,0.85); color: #fff; border: 2px solid #ffcc00; border-radius: 50%; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 20; }
        .zoom-btn:active { background: #ffcc00; color: #000; }

        .manual-box { display: flex; gap: 8px; background: rgba(0,0,0,0.85); padding: 8px 12px; border-radius: 12px; border: 1px solid #444; align-items: center; z-index: 20; }
        .manual-input { width: 95px; padding: 8px; font-size: 1.1rem; text-align: center; border-radius: 6px; border: 1px solid #666; background: #222; color: #fff; }
        .add-manual-btn { background: #4cd964; color: #000; font-weight: bold; border: none; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .add-manual-btn:active { transform: scale(0.95); }

        .controls { position: absolute; bottom: 110px; width: 100%; display: flex; justify-content: center; z-index: 15; }
        .capture-btn { width: 75px; height: 75px; background: #fff; border: 4px solid #4cd964; border-radius: 50%; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 20; }
        .capture-btn:active { transform: scale(0.92); }

        /* Lista a scomparsa e gestione quantità */
        .list-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 30; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease; }
        .list-view.active { transform: translateY(0); }
        .list-header { padding: 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { background: none; border: none; color: #4cd964; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .items-container { flex: 1; overflow-y: auto; padding: 15px; }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #1f1f1f
