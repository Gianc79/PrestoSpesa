<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrestoSpesa</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        html, body { width: 100%; height: 100dvh; height: 100vh; background: #000; color: #fff; overflow: hidden; display: flex; flex-direction: column; }
        
        header { background: #1f1f1f; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 50; flex-shrink: 0; }
        .last-price { font-size: 0.85rem; color: #aaa; display: flex; flex-direction: column; }
        .last-price span { font-size: 1.1rem; font-weight: bold; color: #4cd964; }
        .total { font-size: 1.6rem; font-weight: bold; color: #fff; text-align: center; flex: 1; }
        .list-btn { background: #333; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 5px; z-index: 50; }
        .list-btn span { background: #4cd964; color: #000; border-radius: 50%; padding: 2px 5px; font-size: 0.75rem; font-weight: bold; pointer-events: none; }

        .container { flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #111; }
        
        #video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        
        /* Blocco centrale */
        .center-group { position: absolute; top: 38%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 20; width: 100%; }

        .viewfinder { width: 220px; height: 140px; border: 3px solid #ffcc00; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); pointer-events: none; }
        
        /* Casella manuale e tasto + affiancati, larghezza 220px come il mirino */
        .manual-box { width: 220px; background: rgba(0,0,0,0.85); padding: 8px; border-radius: 12px; border: 1px solid #444; display: flex; flex-direction: row; align-items: center; gap: 8px; z-index: 30; }
        .manual-input { flex: 1; height: 44px; padding: 4px; font-size: 1.3rem; text-align: center; border-radius: 6px; border: 1px solid #666; background: #222; color: #fff; }
        .add-manual-btn { background: #4cd964; color: #000; font-weight: bold; border: none; width: 44px; height: 44px; border-radius: 6px; cursor: pointer; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 35; }
        .add-manual-btn:active { transform: scale(0.95); }

        /* Tasto scatto */
        .controls { position: absolute; bottom: 130px; width: 100%; display: flex; justify-content: center; z-index: 20; }
        .capture-btn { width: 75px; height: 75px; background: #fff; border: 4px solid #4cd964; border-radius: 50%; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 35; }
        .capture-btn:active { transform: scale(0.92); }

        /* Lista a scomparsa e gestione quantità */
        .list-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 100; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease; }
        .list-view.active { transform: translateY(0); }
        .list-header { padding: 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { background: none; border: none; color: #4cd964; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .items-container { flex: 1; overflow-y: auto; padding: 15px; }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #1f1f1f; padding: 12px; border-radius: 8px; margin-bottom: 10px; gap: 8px; font-size: 0.9rem; }
        .item-info { flex: 1; }
        .qty-controls { display: flex; align-items: center; gap: 6px; background: #2a2a2a; padding: 4px 8px; border-radius: 6px; }
        .qty-btn { background: #333; color: #fff; border: none; width: 28px; height: 28px; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .qty-btn:active { background: #4cd964; color: #000; }
        .qty-val { font-weight: bold; min-width: 22px; text-align: center; }
        .item-subtotal { font-weight: bold; color: #4cd964; min-width: 60px; text-align: right; }
        .del-btn { background: #ff3b30; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        
        .list-footer { padding: 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; }
        .clear-btn { background: #333; color: #ff3b30; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; }

        .toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; border-radius: 20px; z-index: 150; display: none; font-size: 0.95rem; }
        .toast.show { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="last-price">Ultimo<span id="lastPriceDisplay">0,00 €</span></div>
        <div class="total" id="totalDisplay">0,00 €</div>
        <button class="list-btn" id="openList">Lista <span id="itemCount">0</span></button>
    </header>

    <div class="container" id="mainContainer">
        <video id="video" autoplay playsinline muted></video>
        
        <div class="center-group">
            <div class="viewfinder"></div>
            
            <div class="manual-box">
                <input type="number" step="0.01" id="manualInput" class="manual-input" placeholder="0,00">
                <button class="add-manual-btn" id="addManualBtn">+</button>
            </div>
        </div>

        <div class="toast" id="toast">Prezzo aggiunto</div>
        
        <div class="controls">
            <button class="capture-btn" id="captureBtn"></button>
        </div>
    </div>

    <div class="list-view" id="listView">
        <div class="list-header">
            <h2>Carrello</h2>
            <button class="close-btn" id="closeList">Chiudi</button>
        </div>
        <div class="items-container" id="itemsContainer"></div>
        <div class="list-footer">
            <div style="font-size: 1.3rem; font-weight: bold; color: #4cd964;" id="listTotal">Tot: 0,00 €</div>
            <button class="clear-btn" id="clearBtn">Svuota</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none;
